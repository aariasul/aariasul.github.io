<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infomed | Panel de Configuración</title>
  <meta name="theme-color" content="#0f172a" />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cropper.js CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .triage-chip.active {
      background: var(--primary) !important;
      color: #ffffff !important;
      border-color: var(--primary) !important;
    }
  </style>
</head>
<body>

  <!-- Barra Superior Fija de Acciones (Sticky Action Header) -->
  <header id="stickyActionHeader" style="display:none; position:sticky; top:0; z-index:900; background:rgba(15, 23, 42, 0.95); backdrop-filter:blur(10px); padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.15); box-shadow:0 4px 20px rgba(0,0,0,0.3);">
    <div style="max-width:800px; margin:0 auto; display:flex; flex-direction:column; gap:10px;">
      <!-- Fila 1: Sesión y Controles -->
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span style="font-size:0.85rem; color:#94a3b8; font-weight:600;">
          Sesión: <strong id="userSessionEmail" style="color:#ffffff;"></strong>
        </span>
        <button type="button" id="btnLogout" style="background:transparent; border:1px solid #475569; color:#f87171; border-radius:8px; padding:4px 10px; font-size:0.8rem; font-weight:700; cursor:pointer;">
          Cerrar Sesión
        </button>
      </div>
      <!-- Fila 2: Acciones Principales -->
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:10px;">
        <a id="btnViewLiveProfile" href="#" target="_blank" rel="noopener noreferrer" style="display:none; align-items:center; gap:6px; background:#0284c7; color:#ffffff; text-decoration:none; padding:8px 14px; border-radius:10px; font-size:0.9rem; font-weight:800;">
          👁️ Ver Perfil
        </a>
        <button type="button" id="btnSaveProfile" style="background:#16a34a; color:#ffffff; border:none; padding:9px 18px; border-radius:10px; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 2px 8px rgba(22,163,74,0.4);">
          Guardar Cambios
        </button>
      </div>
    </div>
  </header>

  <main style="max-width:800px; margin:24px auto; padding:0 16px;">
    <!-- Banner de Alertas y Notificaciones -->
    <div id="statusAlertBanner" style="display:none; padding:12px 16px; margin-bottom:16px; border-radius:12px; font-weight:700; text-align:center; font-size:0.95rem;"></div>

    <!-- Vista 1: Formulario de Autenticación Magic Link -->
    <section id="authSection" style="background:#ffffff; padding:28px 20px; border-radius:18px; border:1.5px solid #cbd5e1; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center;">
      <img src="./infomed.svg" alt="Infomed" style="height:42px; margin-bottom:14px;">
      <h2 style="margin:0 0 8px; color:#0f172a; font-weight:800;">Acceso al Panel Médico</h2>
      <p style="color:#64748b; font-size:0.95rem; margin-bottom:20px;">Ingrese su correo para recibir un enlace de acceso seguro sin contraseñas.</p>
      
      <form id="authForm" style="max-width:380px; margin:0 auto; display:flex; flex-direction:column; gap:12px;">
        <input type="email" id="authEmailInput" placeholder="su-correo@ejemplo.com" required style="width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #94a3b8; font-size:1rem; font-weight:700; box-sizing:border-box;">
        <button type="submit" id="btnSendMagicLink" style="background:#0284c7; color:#ffffff; border:none; padding:12px; border-radius:12px; font-size:1rem; font-weight:800; cursor:pointer;">
          Enviar Enlace Mágico
        </button>
      </form>
    </section>

    <!-- Vista 2: Formulario Principal de Edición -->
    <section id="editorSection" style="display:none;">
      <form id="profileMainForm" onsubmit="return false;" style="display:flex; flex-direction:column; gap:20px;">
        
        <!-- Bloque 1: Identificación y Fotografía -->
        <div style="background:#ffffff; padding:20px; border-radius:16px; border:1.5px solid #cbd5e1;">
          <h3 style="margin:0 0 14px; color:#0f172a; font-size:1.1rem; font-weight:800;">Datos Principales</h3>
          
          <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:16px;">
            <div style="position:relative; width:110px; height:110px; border-radius:50%; overflow:hidden; background:#e2e8f0; border:3px solid #0284c7; flex-shrink:0;">
              <img id="photoPreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Foto" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div>
              <label for="avatarFileInput" style="display:inline-block; background:#0f172a; color:#ffffff; padding:8px 14px; border-radius:10px; font-size:0.85rem; font-weight:700; cursor:pointer;">
                📷 Cambiar Fotografía
              </label>
              <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
              <p style="font-size:0.75rem; color:#64748b; margin:6px 0 0;">Recorte cuadrado 500x500 px obligatorio.</p>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
            <div style="grid-column:1 / -1;">
              <label for="nombre" style="display:block; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:4px;">Nombre Completo</label>
              <input type="text" id="nombre" placeholder="Nombre y apellidos" style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #94a3b8; font-size:1rem; font-weight:700; box-sizing:border-box;">
            </div>
            <div>
              <label for="cedula" style="display:block; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:4px;">Cédula o Pasaporte</label>
              <input type="text" id="cedula" placeholder="Identificación nacional" style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #94a3b8; font-size:1rem; font-weight:700; box-sizing:border-box;">
            </div>
            <div>
              <label for="slug" style="display:block; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:4px;">Identificador URL (Slug Inmutable)</label>
              <input type="text" id="slug" readonly style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #64748b; font-size:1rem; font-weight:800; background:#0f172a; color:#38bdf8; cursor:not-allowed; box-sizing:border-box;">
            </div>
          </div>
        </div>

        <!-- Bloque 2: Triage y Condiciones Médicas -->
        <div style="background:#ffffff; padding:20px; border-radius:16px; border:1.5px solid #cbd5e1;">
          <h3 style="margin:0 0 14px; color:#0f172a; font-size:1.1rem; font-weight:800;">Triage y Parámetros Vitales</h3>
          
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;">
            <div>
              <label for="tipoSangre" style="display:block; font-size:0.85rem; font-weight:700; color:#dc2626; margin-bottom:4px;">Tipo de Sangre</label>
              <select id="tipoSangre" style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #fca5a5; font-size:1rem; font-weight:800; background:#fef2f2; color:#991b1b; box-sizing:border-box;">
                <option value="">Seleccione...</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
            <div>
              <label for="donanteOrganos" style="display:block; font-size:0.85rem; font-weight:700; color:#16a34a; margin-bottom:4px;">Donante de Órganos</label>
              <select id="donanteOrganos" style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #86efac; font-size:1rem; font-weight:800; background:#f0fdf4; color:#166534; box-sizing:border-box;">
                <option value="">No especificado</option>
                <option value="Sí / Yes">Sí / Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div style="grid-column:1 / -1;">
              <label for="seguroMedico" style="display:block; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:4px;">Seguro Médico / Póliza</label>
              <input type="text" id="seguroMedico" placeholder="Ej: CCSS Asegurado Directo o INS Póliza #12345" style="width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid #94a3b8; font-size:1rem; font-weight:700; box-sizing:border-box;">
            </div>
          </div>

          <label style="display:block; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:8px;">Chips de Alerta Rápida</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
            <button type="button" class="triage-chip" data-category="Alergia" data-value="Penicilina" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">Penicilina</button>
            <button type="button" class="triage-chip" data-category="Alergia" data-value="Sulfas" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">Sulfas</button>
            <button type="button" class="triage-chip" data-category="Alergia" data-value="AINEs / Aspirina" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">AINEs / Aspirina</button>
            <button type="button" class="triage-chip" data-category="Condición" data-value="Diabético Tipo 1" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">Diabético Tipo 1</button>
            <button type="button" class="triage-chip" data-category="Condición" data-value="Hipertensión" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">Hipertensión</button>
            <button type="button" class="triage-chip" data-category="Condición" data-value="Asmático" style="padding:6px 12px; border-radius:999px; border:1.5px solid #cbd5e1; background:#f8fafc; font-size:0.85rem; font-weight:700; cursor:pointer;">Asmático</button>
          </div>

          <!-- Contenedor de Condiciones Dinámicas Libres -->
          <div id="condicionesContainer"></div>

          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
            <button type="button" id="btnAddAllergy" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; padding:8px 12px; border-radius:8px; font-size:0.85rem; font-weight:800; cursor:pointer;">+ Agregar Alergia</button>
            <button type="button" id="btnAddCondition" style="background:#e0f2fe; color:#0369a1; border:1px solid #7dd3fc; padding:8px 12px; border-radius:8px; font-size:0.85rem; font-weight:800; cursor:pointer;">+ Agregar Condición</button>
            <button type="button" id="btnAddMedication" style="background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; padding:8px 12px; border-radius:8px; font-size:0.85rem; font-weight:800; cursor:pointer;">+ Agregar Medicamento</button>
          </div>
        </div>

        <!-- Bloque 3: Contactos de Emergencia -->
        <div style="background:#ffffff; padding:20px; border-radius:16px; border:1.5px solid #cbd5e1;">
          <h3 style="margin:0 0 14px; color:#0f172a; font-size:1.1rem; font-weight:800;">Contactos de Emergencia</h3>
          
          <!-- Contenedor de Filas de Contactos -->
          <div id="contactosContainer"></div>

          <button type="button" id="btnAddContact" style="background:#0f172a; color:#ffffff; border:none; padding:10px 16px; border-radius:10px; font-size:0.9rem; font-weight:800; cursor:pointer;">
            + Agregar Contacto Adicional
          </button>
        </div>

      </form>
    </section>
  </main>

  <!-- Modal Cropper.js -->
  <div id="cropperModal" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:16px;">
    <div style="background:#ffffff; width:min(500px, 100%); border-radius:20px; padding:20px; box-shadow:0 25px 50px rgba(0,0,0,0.3);">
      <h3 style="margin:0 0 12px; color:#0f172a; font-weight:800;">Recortar Fotografía</h3>
      <div style="max-height:360px; overflow:hidden; border-radius:12px; background:#000000; margin-bottom:16px;">
        <img id="imageToCrop" src="" alt="Recorte" style="max-width:100%; display:block;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" id="btnCropCancel" style="background:#e2e8f0; color:#334155; border:none; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer;">Cancelar</button>
        <button type="button" id="btnCropConfirm" style="background:#0284c7; color:#ffffff; border:none; padding:10px 18px; border-radius:10px; font-weight:800; cursor:pointer;">Confirmar Recorte</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Configuración de Supabase ---
    const SUPABASE_URL = 'https://xuayajienpmmgzbqbcee.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qLE4nWSdJ02RJlo4HAn2QQ_tgx_YHrj';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2. Estado Global de la Aplicación ---
    let currentUser = null;
    let userProfile = null;
    let cropperInstance = null;
    let currentLang = 'es';
    const DRAFT_KEY = 'infomed_builder_draft';

    // --- 3. Diccionario Multilingüe del Builder ---
    const builderI18n = {
      es: {
        sessionActive: "Sesión iniciada:",
        logoutBtn: "Cerrar Sesión",
        viewProfileBtn: "👁️ Ver Perfil",
        saveBtn: "Guardar Cambios",
        savingBtn: "Guardando...",
        authSuccessTitle: "¡Enlace Mágico Enviado!",
        authSuccessDesc: "Revisa tu correo electrónico para acceder directamente.",
        saveSuccessMsg: "¡Cambios guardados exitosamente en la base de datos!",
        saveErrorMsg: "Error al guardar el perfil médico.",
        uploadErrorMsg: "Error al subir la imagen a la nube.",
        confirmDeleteContact: "¿Eliminar este contacto de emergencia?",
        confirmDeleteCondition: "¿Eliminar esta condición/alergia?",
        contactDefaultName: "Contacto de Emergencia",
        conditionPlaceholder: "Descripción médica o medicamento...",
        draftRestoredMsg: "Se ha recuperado un borrador no guardado previamente."
      },
      en: {
        sessionActive: "Signed in as:",
        logoutBtn: "Log Out",
        viewProfileBtn: "👁️ View Profile",
        saveBtn: "Save Changes",
        savingBtn: "Saving...",
        authSuccessTitle: "Magic Link Sent!",
        authSuccessDesc: "Check your email inbox to log in directly.",
        saveSuccessMsg: "Profile saved successfully to database!",
        saveErrorMsg: "Error saving medical profile.",
        uploadErrorMsg: "Error uploading profile image.",
        confirmDeleteContact: "Remove this emergency contact?",
        confirmDeleteCondition: "Remove this condition/allergy?",
        contactDefaultName: "Emergency Contact",
        conditionPlaceholder: "Medical note or medication...",
        draftRestoredMsg: "A previously unsaved local draft was restored."
      }
    };

    function bt(key) {
      return builderI18n[currentLang][key] || builderI18n['es'][key] || key;
    }

    // --- 4. Generación y Manejo de Slug Inmutable ---
    function generateSlugFromName(name) {
      if (!name) return '';
      const initial = name.trim().charAt(0).toLowerCase() || 'p';
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${initial}-${yy}${mm}${dd}${hh}${min}`;
    }

    function handleNameInputAutoSlug() {
      const slugInput = document.getElementById('slug');
      const nameInput = document.getElementById('nombre');
      if (!slugInput || !nameInput) return;

      if (!userProfile || !userProfile.slug) {
        slugInput.value = generateSlugFromName(nameInput.value);
        saveDraftToLocal();
      }
    }

    // --- 5. Sistema de Autoguardado en Borrador Local (localStorage) ---
    function saveDraftToLocal() {
      if (!currentUser) return;

      const draftData = {
        nombre: document.getElementById('nombre')?.value || '',
        cedula: document.getElementById('cedula')?.value || '',
        tipoSangre: document.getElementById('tipoSangre')?.value || '',
        donante: document.getElementById('donanteOrganos')?.value || '',
        seguro: document.getElementById('seguroMedico')?.value || '',
        photo_src: document.getElementById('photoPreview')?.src || '',
        contactos: collectContactsFromUI(),
        condiciones: collectConditionsFromUI(),
        activeChips: Array.from(document.querySelectorAll('.triage-chip.active')).map(c => c.dataset.value || c.textContent.trim()),
        timestamp: Date.now()
      };

      try {
        localStorage.setItem(`${DRAFT_KEY}_${currentUser.id}`, JSON.stringify(draftData));
      } catch (e) {
        console.warn('Fallo al respaldar borrador en localStorage:', e);
      }
    }

    function clearDraftLocal() {
      if (!currentUser) return;
      try {
        localStorage.removeItem(`${DRAFT_KEY}_${currentUser.id}`);
      } catch (e) {}
    }

    function restoreDraftIfAvailable() {
      if (!currentUser) return;
      try {
        const raw = localStorage.getItem(`${DRAFT_KEY}_${currentUser.id}`);
        if (!raw) return;
        const draft = JSON.parse(raw);

        const currentName = document.getElementById('nombre')?.value.trim();
        if (!currentName && draft.nombre) {
          if (document.getElementById('nombre')) document.getElementById('nombre').value = draft.nombre;
          if (document.getElementById('cedula')) document.getElementById('cedula').value = draft.cedula;
          if (document.getElementById('tipoSangre')) document.getElementById('tipoSangre').value = draft.tipoSangre;
          if (document.getElementById('donanteOrganos')) document.getElementById('donanteOrganos').value = draft.donante;
          if (document.getElementById('seguroMedico')) document.getElementById('seguroMedico').value = draft.seguro;

          if (draft.contactos?.length) renderLoadedContacts(draft.contactos);
          if (draft.condiciones?.length) renderLoadedConditions(draft.condiciones);

          if (draft.activeChips?.length) {
            document.querySelectorAll('.triage-chip').forEach(chip => {
              const val = chip.dataset.value || chip.textContent.trim();
              if (draft.activeChips.includes(val)) {
                chip.classList.add('active');
              }
            });
          }

          showAlertBanner(bt('draftRestoredMsg'), 'info');
        }
      } catch (e) {
        console.warn('Error al procesar borrador local:', e);
      }
    }

    // --- 6. Manejo de Contactos Dinámicos ---
    function addContactRow(data = {}) {
      const container = document.getElementById('contactosContainer');
      if (!container) return;

      const idx = container.querySelectorAll('.contact-row-builder').length + 1;
      const row = document.createElement('div');
      row.className = 'contact-row-builder';
      row.style.cssText = 'background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:12px; margin-bottom:12px; position:relative;';

      row.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="font-size:0.9rem; color:#0f172a;">${bt('contactDefaultName')} #${idx}</strong>
          <button type="button" class="btn-remove-contact" style="background:#fee2e2; color:#dc2626; border:none; border-radius:6px; padding:4px 8px; font-weight:700; cursor:pointer;">✕</button>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div>
            <label style="font-size:0.8rem; font-weight:700; color:#475569;">Nombre</label>
            <input type="text" class="input-contact-name" value="${data.nombre || ''}" placeholder="Nombre del contacto" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid #94a3b8; font-weight:700; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:0.8rem; font-weight:700; color:#475569;">Teléfono (E.164)</label>
            <input type="tel" class="input-contact-phone" value="${data.telefono || ''}" placeholder="Ej: 60405878 o +50660405878" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid #94a3b8; font-weight:700; box-sizing:border-box;">
          </div>
        </div>
      `;

      row.querySelector('.btn-remove-contact').addEventListener('click', () => {
        row.remove();
        saveDraftToLocal();
      });

      container.appendChild(row);
      saveDraftToLocal();
    }

    function renderLoadedContacts(contactosList = []) {
      const container = document.getElementById('contactosContainer');
      if (!container) return;
      container.innerHTML = '';

      if (contactosList.length) {
        contactosList.forEach(c => {
          addContactRow({
            nombre: c.nombre_es || c.nombre || '',
            telefono: c.telefono || ''
          });
        });
      } else {
        addContactRow();
      }
    }

    function collectContactsFromUI() {
      const rows = document.querySelectorAll('.contact-row-builder');
      const contacts = [];

      rows.forEach(r => {
        const name = r.querySelector('.input-contact-name')?.value.trim();
        const rawPhone = r.querySelector('.input-contact-phone')?.value.trim();
        if (name || rawPhone) {
          contacts.push({
            nombre: name || bt('contactDefaultName'),
            telefono: rawPhone || ''
          });
        }
      });

      return contacts;
    }

    // --- 7. Manejo de Triage, Chips y Condiciones Dinámicas ---
    function addConditionRow(category = 'Condición', value = '') {
      const container = document.getElementById('condicionesContainer');
      if (!container) return;

      const row = document.createElement('div');
      row.className = 'condition-single-row';
      row.dataset.category = category;
      row.style.cssText = 'display:flex; gap:8px; align-items:center; margin-bottom:8px;';

      const isAllergy = category.toLowerCase().includes('alergia');
      const isMed = category.toLowerCase().includes('medica');
      const badgeBg = isAllergy ? '#fee2e2' : (isMed ? '#eff6ff' : '#f1f5f9');
      const badgeColor = isAllergy ? '#dc2626' : (isMed ? '#2563eb' : '#475569');

      row.innerHTML = `
        <span style="font-size:0.75rem; font-weight:800; background:${badgeBg}; color:${badgeColor}; padding:6px 10px; border-radius:6px; white-space:nowrap; text-transform:uppercase;">
          ${category}
        </span>
        <input type="text" class="input-condition-value" value="${value}" placeholder="${bt('conditionPlaceholder')}" style="flex:1; padding:8px 10px; border-radius:8px; border:1.5px solid #94a3b8; font-weight:700; box-sizing:border-box;">
        <button type="button" class="btn-remove-cond" style="background:#fee2e2; color:#dc2626; border:none; border-radius:6px; padding:8px 12px; font-weight:800; cursor:pointer;">✕</button>
      `;

      row.querySelector('.btn-remove-cond').addEventListener('click', () => {
        row.remove();
        saveDraftToLocal();
      });

      container.appendChild(row);
      saveDraftToLocal();
    }

    function renderLoadedConditions(condicionesList = []) {
      const container = document.getElementById('condicionesContainer');
      if (!container) return;
      container.innerHTML = '';

      condicionesList.forEach(co => {
        const cat = co.titulo_es || co.titulo_en || 'Condición';
        const val = co.valor_es || co.valor_en || '';
        
        let matchedChip = false;
        document.querySelectorAll('.triage-chip').forEach(chip => {
          const chipVal = (chip.dataset.value || chip.textContent).trim().toLowerCase();
          if (chipVal === val.toLowerCase()) {
            chip.classList.add('active');
            matchedChip = true;
          }
        });

        if (!matchedChip && val) {
          addConditionRow(cat, val);
        }
      });
    }

    function collectConditionsFromUI() {
      const results = [];

      document.querySelectorAll('.triage-chip.active').forEach(chip => {
        const cat = chip.dataset.category || 'Alergia';
        const val = (chip.dataset.value || chip.textContent).trim();
        if (val) {
          results.push({
            titulo_es: cat,
            titulo_en: cat === 'Alergia' ? 'Allergy' : 'Condition',
            valor_es: val,
            valor_en: val
          });
        }
      });

      document.querySelectorAll('.condition-single-row').forEach(row => {
        const cat = row.dataset.category || 'Condición';
        const val = row.querySelector('.input-condition-value')?.value.trim();
        if (val) {
          results.push({
            titulo_es: cat,
            titulo_en: cat.toLowerCase().includes('alergia') ? 'Allergy' : (cat.toLowerCase().includes('medica') ? 'Medication' : 'Condition'),
            valor_es: val,
            valor_en: val
          });
        }
      });

      return results;
    }

    // --- 8. Procesamiento de Fotos con Cropper.js (Client-Side) ---
    function setupCropperModal() {
      const fileInput = document.getElementById('avatarFileInput');
      const cropModal = document.getElementById('cropperModal');
      const imageToCrop = document.getElementById('imageToCrop');
      const btnCropConfirm = document.getElementById('btnCropConfirm');
      const btnCropCancel = document.getElementById('btnCropCancel');

      if (!fileInput || !cropModal || !imageToCrop) return;

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          imageToCrop.src = ev.target.result;
          cropModal.style.display = 'flex';

          if (cropperInstance) cropperInstance.destroy();
          cropperInstance = new Cropper(imageToCrop, {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 1,
            responsive: true
          });
        };
        reader.readAsDataURL(file);
      });

      btnCropCancel?.addEventListener('click', () => {
        if (cropperInstance) cropperInstance.destroy();
        cropModal.style.display = 'none';
        fileInput.value = '';
      });

      btnCropConfirm?.addEventListener('click', async () => {
        if (!cropperInstance || !currentUser) return;

        btnCropConfirm.disabled = true;
        btnCropConfirm.textContent = '...';

        try {
          const canvas = cropperInstance.getCroppedCanvas({
            width: 500,
            height: 500,
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
          });

          canvas.toBlob(async (blob) => {
            if (!blob) throw new Error("Fallo al generar Blob de la imagen");

            const filePath = `${currentUser.id}/profile.jpg`;

            const { error: uploadError } = await supabaseClient.storage
              .from('avatars')
              .upload(filePath, blob, {
                upsert: true,
                contentType: 'image/jpeg'
              });

            if (uploadError) throw uploadError;

            const { data: publicUrlData } = supabaseClient.storage
              .from('avatars')
              .getPublicUrl(filePath);

            const finalPhotoUrl = `${publicUrlData.publicUrl}?t=${Date.now()}`;

            const previewEl = document.getElementById('photoPreview');
            if (previewEl) previewEl.src = finalPhotoUrl;

            cropperInstance.destroy();
            cropModal.style.display = 'none';
            fileInput.value = '';

            saveDraftToLocal();
          }, 'image/jpeg', 0.85);

        } catch (err) {
          console.error(err);
          showAlertBanner(bt('uploadErrorMsg'), 'error');
        } finally {
          btnCropConfirm.disabled = false;
          btnCropConfirm.textContent = 'Confirmar Recorte';
        }
      });
    }

    // --- 9. Guardado Atómico vía Procedimiento RPC (PostgreSQL) ---
    async function handleSaveProfile() {
      const btnSave = document.getElementById('btnSaveProfile');
      if (!btnSave || !currentUser) return;

      const slugInput = document.getElementById('slug');
      const nombreInput = document.getElementById('nombre');
      const cedulaInput = document.getElementById('cedula');
      const tipoSangreInput = document.getElementById('tipoSangre');
      const donanteInput = document.getElementById('donanteOrganos');
      const seguroInput = document.getElementById('seguroMedico');
      const photoPreview = document.getElementById('photoPreview');

      const nombreVal = nombreInput?.value.trim() || '';
      let slugVal = slugInput?.value.trim() || '';

      if (!nombreVal) {
        alert("Por favor ingrese el nombre del portador.");
        nombreInput?.focus();
        return;
      }

      if (!slugVal) {
        slugVal = generateSlugFromName(nombreVal);
        if (slugInput) slugInput.value = slugVal;
      }

      btnSave.disabled = true;
      btnSave.textContent = bt('savingBtn');

      const contactosPayload = collectContactsFromUI();
      const condicionesPayload = collectConditionsFromUI();

      try {
        const { data, error } = await supabaseClient.rpc('save_medical_profile', {
          p_uid: currentUser.id,
          p_slug: slugVal,
          p_cedula: cedulaInput?.value.trim() || '',
          p_nombre: nombreVal,
          p_photo_src: photoPreview?.src || '',
          p_logo_src: './infomed.svg',
          p_background_src: './bg01.jpg',
          p_tipo_sangre: tipoSangreInput?.value || '',
          p_donante_organos: donanteInput?.value || '',
          p_seguro_medico: seguroInput?.value.trim() || '',
          p_contactos: contactosPayload,
          p_condiciones: condicionesPayload
        });

        if (error) throw error;

        clearDraftLocal();

        userProfile = {
          ...userProfile,
          slug: slugVal,
          nombre_es: nombreVal
        };

        const btnView = document.getElementById('btnViewLiveProfile');
        if (btnView) {
          btnView.href = `./index-db.html?slug=${slugVal}`;
          btnView.style.display = 'inline-flex';
        }

        showAlertBanner(bt('saveSuccessMsg'), 'success');

      } catch (err) {
        console.error('Fallo al invocar save_medical_profile:', err);
        showAlertBanner(bt('saveErrorMsg'), 'error');
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = bt('saveBtn');
      }
    }

    // --- 10. Carga de Datos Iniciales de Supabase ---
    async function loadUserData(user) {
      currentUser = user;

      const emailEl = document.getElementById('userSessionEmail');
      if (emailEl) emailEl.textContent = user.email || '';

      try {
        const { data: usuario, error: uErr } = await supabaseClient
          .from('usuarios')
          .select('*')
          .eq('uid', user.id)
          .maybeSingle();

        if (uErr) throw uErr;

        if (usuario) {
          userProfile = usuario;

          if (document.getElementById('slug')) {
            document.getElementById('slug').value = usuario.slug || '';
            document.getElementById('slug').readOnly = true;
          }
          if (document.getElementById('nombre')) document.getElementById('nombre').value = usuario.nombre_es || '';
          if (document.getElementById('cedula')) document.getElementById('cedula').value = usuario.cedula || '';
          if (document.getElementById('tipoSangre')) document.getElementById('tipoSangre').value = usuario.tipo_sangre || '';
          if (document.getElementById('donanteOrganos')) document.getElementById('donanteOrganos').value = usuario.donante_organos || '';
          if (document.getElementById('seguroMedico')) document.getElementById('seguroMedico').value = usuario.seguro_medico || '';
          if (document.getElementById('photoPreview') && usuario.photo_src) {
            document.getElementById('photoPreview').src = usuario.photo_src;
          }

          const [{ data: contactos }, { data: condiciones }] = await Promise.all([
            supabaseClient.from('contactos').select('*').eq('usuario_id', usuario.id).order('id'),
            supabaseClient.from('condiciones').select('*').eq('usuario_id', usuario.id).order('id')
          ]);

          renderLoadedContacts(contactos || []);
          renderLoadedConditions(condiciones || []);

          const btnView = document.getElementById('btnViewLiveProfile');
          if (btnView && usuario.slug) {
            btnView.href = `./index-db.html?slug=${usuario.slug}`;
            btnView.style.display = 'inline-flex';
          }

        } else {
          renderLoadedContacts([]);
          restoreDraftIfAvailable();
        }

      } catch (err) {
        console.error('Error cargando datos del perfil:', err);
      }
    }

    // --- 11. Autenticación Magic Link (OTP) y Alertas ---
    function showAlertBanner(text, type = 'info') {
      const banner = document.getElementById('statusAlertBanner');
      if (!banner) return;

      banner.textContent = text;
      banner.style.display = 'block';

      if (type === 'success') {
        banner.style.background = '#dcfce7';
        banner.style.color = '#15803d';
        banner.style.border = '1px solid #86efac';
      } else if (type === 'error') {
        banner.style.background = '#fee2e2';
        banner.style.color = '#b91c1c';
        banner.style.border = '1px solid #fca5a5';
      } else {
        banner.style.background = '#e0f2fe';
        banner.style.color = '#0369a1';
        banner.style.border = '1px solid #7dd3fc';
      }

      setTimeout(() => {
        banner.style.display = 'none';
      }, 5000);
    }

    async function handleSendMagicLink(e) {
      e.preventDefault();
      const emailInput = document.getElementById('authEmailInput');
      const btnSend = document.getElementById('btnSendMagicLink');
      const email = emailInput?.value.trim();

      if (!email) return;

      btnSend.disabled = true;
      btnSend.textContent = '...';

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: window.location.href
          }
        });

        if (error) throw error;
        showAlertBanner(bt('authSuccessTitle') + ' ' + bt('authSuccessDesc'), 'success');

      } catch (err) {
        console.error(err);
        showAlertBanner(err.message || 'Error al enviar enlace mágico.', 'error');
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = 'Enviar Enlace Mágico';
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      clearDraftLocal();
      window.location.reload();
    }

    // --- 12. Inicialización Segura del Ciclo de Vida del DOM ---
    window.addEventListener('DOMContentLoaded', async () => {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        const authSection = document.getElementById('authSection');
        const editorSection = document.getElementById('editorSection');
        const stickyBar = document.getElementById('stickyActionHeader');

        if (session && session.user) {
          if (authSection) authSection.style.display = 'none';
          if (editorSection) editorSection.style.display = 'block';
          if (stickyBar) stickyBar.style.display = 'block';
          loadUserData(session.user);
        } else {
          if (authSection) authSection.style.display = 'block';
          if (editorSection) editorSection.style.display = 'none';
          if (stickyBar) stickyBar.style.display = 'none';
        }
      });

      document.getElementById('authForm')?.addEventListener('submit', handleSendMagicLink);
      document.getElementById('btnLogout')?.addEventListener('click', handleLogout);
      document.getElementById('btnSaveProfile')?.addEventListener('click', handleSaveProfile);

      document.getElementById('nombre')?.addEventListener('input', handleNameInputAutoSlug);
      document.getElementById('profileMainForm')?.addEventListener('input', saveDraftToLocal);

      document.querySelectorAll('.triage-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          chip.classList.toggle('active');
          saveDraftToLocal();
        });
      });

      document.getElementById('btnAddAllergy')?.addEventListener('click', () => addConditionRow('Alergia'));
      document.getElementById('btnAddCondition')?.addEventListener('click', () => addConditionRow('Condición'));
      document.getElementById('btnAddMedication')?.addEventListener('click', () => addConditionRow('Medicamento'));

      document.getElementById('btnAddContact')?.addEventListener('click', () => addContactRow());

      setupCropperModal();
    });
  </script>
