<style type="text/css">
	.st0{fill:url(#SVGID_1_);}
	.st1{fill:url(#SVGID_00000076573291801569684500000000700001578218338238_);}

	/* CSS Transform Setup */
	.bg-vector {
		transform-box: fill-box;
		transform-origin: center;
		will-change: transform;
	}

	/* 
	   Runs 1 time at 0.3x speed, then freezes at the resting 100% position.
	*/
	.bg-vector-1 {
		animation: travelLeftToRight 53.33s cubic-bezier(0.45, 0.05, 0.55, 0.95) 1 forwards;
	}

	.bg-vector-2 {
		animation: travelRightToLeft 66.67s cubic-bezier(0.37, 0, 0.63, 1) 1 forwards;
	}

	/* Left Shape: Horizontal drift to the right and back */
	@keyframes travelLeftToRight {
		0% {
			transform: translate(0, 0);
		}
		35% {
			transform: translate(650px, -20px) rotate(1deg);
		}
		50% {
			transform: translate(900px, 10px);
		}
		80% {
			transform: translate(300px, -10px) rotate(-1deg);
		}
		100% {
			transform: translate(0, 0);
		}
	}

	/* Right Shape: Horizontal drift to the left and back */
	@keyframes travelRightToLeft {
		0% {
			transform: translate(0, 0);
		}
		30% {
			transform: translate(-500px, 15px) rotate(-1.5deg);
		}
		55% {
			transform: translate(-900px, -15px);
		}
		85% {
			transform: translate(-250px, 10px) rotate(0.5deg);
		}
		100% {
			transform: translate(0, 0);
		}
	}

	@media (prefers-reduced-motion: reduce) {
		.bg-vector {
			animation: none !important;
		}
	}
</style>

