<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Generator</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}h1{text-align:center}.controls{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}.controls label{display:flex;flex-direction:column;font-size:.9rem;font-weight:bold}#qrBox{width:500px;height:500px;margin:20px auto;position:relative;background:#fff;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center}#qrBox.dragover{border-color:#0078d7;background:#eef7ff}#qrcode svg{width:100%;height:100%}#logoOverlay{position:absolute;display:none;background:#fff;padding:8px;border-radius:12px}.buttons{text-align:center}.buttons button{margin:5px;padding:8px 16px}</style></head><body><h1>QR Code Generator</h1><div class="controls"><label>URL<input id="urlInput" type="text" value="https://example.com"></label><label>Error Correction<select id="ecLevel"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></label><label>Logo File / URL<input id="logoInput" type="text"></label><button id="browseBtn" type="button">Browse...</button><input id="fileInput" hidden type="file" accept=".svg,.png,.jpg,.jpeg"><label>Show Logo<input id="logoToggle" type="checkbox" checked></label><label>Logo Size<input id="logoSize" type="range" min="50" max="200" value="100"></label></div><div id="qrBox"><div id="qrcode"></div><img id="logoOverlay"></div><div class="buttons"><button id="copyBtn">Copy SVG</button><button id="downloadBtn">Download SVG</button><button id="downloadPngBtn">Download PNG</button><button id="resetBtn">Reset</button></div><script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script><script>const QR_SIZE=500,$=id=>document.getElementById(id),logo=$('logoOverlay'),box=$('qrBox');function generateQR(){const useLogo=$('logoToggle').checked&&logo.src;let ec=useLogo?'H':$('ecLevel').value;if(useLogo){$('ecLevel').value='H';$('ecLevel').disabled=true;}else{$('ecLevel').disabled=false;}const qr=qrcode(0,ec);qr.addData($('urlInput').value||'');qr.make();$('qrcode').innerHTML=qr.createSvgTag({cellSize:QR_SIZE/qr.getModuleCount(),margin:2,scalable:true});if(useLogo){logo.style.display='block';logo.style.width=$('logoSize').value+'px';logo.style.height=$('logoSize').value+'px';logo.style.left='50%';logo.style.top='50%';logo.style.transform='translate(-50%,-50%)';}else{logo.style.display='none';}}function mergedSvg(){const s=document.querySelector('#qrcode svg').cloneNode(true);if($('logoToggle').checked&&logo.src){const size=parseInt($('logoSize').value),x=(QR_SIZE-size)/2,y=(QR_SIZE-size)/2;const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('x',x-8);bg.setAttribute('y',y-8);bg.setAttribute('width',size+16);bg.setAttribute('height',size+16);bg.setAttribute('fill','white');bg.setAttribute('rx','12');s.appendChild(bg);const img=document.createElementNS('http://www.w3.org/2000/svg','image');img.setAttribute('href',logo.src);img.setAttribute('x',x);img.setAttribute('y',y);img.setAttribute('width',size);img.setAttribute('height',size);s.appendChild(img);}return s;}$('browseBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;$('logoInput').value=f.name;const r=new FileReader();r.onload=v=>{logo.src=v.target.result;generateQR();};r.readAsDataURL(f);};$('logoInput').addEventListener('change',()=>{const v=$('logoInput').value.trim();if(v.startsWith('http')){logo.src=v;logo.onload=generateQR;}});['urlInput','ecLevel','logoToggle','logoSize'].forEach(i=>$(i).addEventListener('input',generateQR));box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('dragover');});box.addEventListener('dragleave',()=>box.classList.remove('dragover'));box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('dragover');const f=e.dataTransfer.files[0];if(!f)return;$('logoInput').value=f.name;const r=new FileReader();r.onload=v=>{logo.src=v.target.result;generateQR();};r.readAsDataURL(f);});$('copyBtn').onclick=()=>navigator.clipboard.writeText(mergedSvg().outerHTML);$('downloadBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([mergedSvg().outerHTML],{type:'image/svg+xml'}));a.download='QR_code.svg';a.click();};$('downloadPngBtn').onclick=()=>{const img=new Image();const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(mergedSvg())],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=QR_SIZE;c.height=QR_SIZE;c.getContext('2d').drawImage(img,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='QR_code.png';a.click();};img.src=url;};$('resetBtn').onclick=()=>{$('urlInput').value='https://example.com';$('ecLevel').value='M';$('ecLevel').disabled=false;$('logoInput').value='';$('logoToggle').checked=true;$('logoSize').value=100;logo.removeAttribute('src');$('fileInput').value='';generateQR();};generateQR();</script></body></html>
