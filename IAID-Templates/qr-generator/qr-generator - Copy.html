<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator with Drag & Drop Logo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .controls label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      font-size: 0.9rem;
    }
    #qrBox {
      width: 500px;
      height: 500px;
      margin: 0 auto;
      position: relative;
      background: white;
      border: 2px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrBox.dragover {
      border-color: #0078d7;
      background: #eef7ff;
    }
    #qrcode svg {
      width: 100%;
      height: 100%;
    }
    #logoOverlay {
      position: absolute;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      padding: 8px;
      display: none;
    }
    .buttons {
      text-align: center;
      margin-top: 20px;
    }
    .buttons button {
      margin: 0 10px;
      padding: 8px 16px;
      font-weight: bold;
    }
    #logoSize {
      width: 200px;
      accent-color: #0078d7;
    }
    #logoSize.warning {
      accent-color: red;
    }
  </style>
</head>
<body>
  <h1>QR Code Generator (SVG + PNG + Drag & Drop)</h1>

  <div class="controls">
    <label>
      URL:
      <input type="text" id="urlInput" value="https://example.com" size="40">
    </label>
    <label>
      Foreground Color:
      <input type="color" id="colorInput" value="#000000">
    </label>
    <label>
      Background Color:
      <input type="color" id="bgInput" value="#ffffff">
    </label>
    <label>
      Error Correction:
      <select id="ecLevel">
        <option value="L">Low (L)</option>
        <option value="M" selected>Medium (M)</option>
        <option value="Q">Quartile (Q)</option>
        <option value="H">High (H)</option>
      </select>
    </label>
    <label>
      Logo URL:
      <input type="text" id="logoInput" value="">
    </label>
    <label>
      Show Logo:
      <input type="checkbox" id="logoToggle" checked>
    </label>
    <label>
      Logo Size:
      <input type="range" id="logoSize" min="50" max="200" value="100">
    </label>
    <label>
      Quiet Zone:
      <input type="range" id="quietZone" min="0" max="20" value="2">
    </label>
  </div>

  <div id="qrBox">
    <div id="qrcode"></div>
    <img id="logoOverlay" src="" alt="Logo">
  </div>

  <div class="buttons">
    <button id="copyBtn">Copy SVG</button>
    <button id="downloadBtn">Download SVG</button>
    <button id="downloadPngBtn">Download PNG</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
  <script>
    const urlInput = document.getElementById('urlInput');
    const colorInput = document.getElementById('colorInput');
    const bgInput = document.getElementById('bgInput');
    const ecLevel = document.getElementById('ecLevel');
    const logoInput = document.getElementById('logoInput');
    const logoToggle = document.getElementById('logoToggle');
    const logoSize = document.getElementById('logoSize');
    const quietZone = document.getElementById('quietZone');
    const qrContainer = document.getElementById('qrcode');
    const logoOverlay = document.getElementById('logoOverlay');
    const qrBox = document.getElementById('qrBox');
    function generateQR() {
      qrContainer.innerHTML = "";

      let errorCorrectionLevel = ecLevel.value;
      if (logoToggle.checked && (logoInput.value || logoOverlay.src)) {
        errorCorrectionLevel = "H";
        ecLevel.value = "H";
      }

      const typeNumber = 0;
      const qr = qrcode(typeNumber, errorCorrectionLevel);
      qr.addData(urlInput.value);
      qr.make();

      const svgTag = qr.createSvgTag({
        cellSize: 500 / qr.getModuleCount(),
        margin: parseInt(quietZone.value),
        scalable: true,
        fgColor: colorInput.value,
        bgColor: bgInput.value
      });

      qrContainer.innerHTML = svgTag;

      if (logoToggle.checked && (logoInput.value || logoOverlay.src)) {
        logoOverlay.style.display = "block";
        logoOverlay.style.width = logoSize.value + "px";
        logoOverlay.style.height = logoSize.value + "px";
        logoOverlay.style.left = "50%";
        logoOverlay.style.top = "50%";
        logoOverlay.style.transform = "translate(-50%, -50%)";
      } else {
        logoOverlay.style.display = "none";
      }

      if (parseInt(logoSize.value) > 125) {
        logoSize.classList.add("warning");
      } else {
        logoSize.classList.remove("warning");
      }
    }

    [urlInput, colorInput, bgInput, ecLevel, logoInput, logoToggle, logoSize, quietZone].forEach(el => {
      el.addEventListener('input', generateQR);
    });

    // Drag & Drop logo
    qrBox.addEventListener('dragover', e => {
      e.preventDefault();
      qrBox.classList.add('dragover');
    });
    qrBox.addEventListener('dragleave', () => {
      qrBox.classList.remove('dragover');
    });
    qrBox.addEventListener('drop', e => {
      e.preventDefault();
      qrBox.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && (file.type.includes("image/png") || file.type.includes("image/jpeg") || file.type.includes("image/svg"))) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          logoOverlay.src = evt.target.result;
          logoInput.value = "";
          generateQR();
        };
        reader.readAsDataURL(file);
      }
    });

    // Copy SVG
    document.getElementById('copyBtn').addEventListener('click', () => {
      const svgElement = qrContainer.querySelector('svg');
      if (svgElement) {
        const svgText = svgElement.outerHTML;
        navigator.clipboard.writeText(svgText).then(() => {
          alert("SVG copied to clipboard!");
        });
      }
    });

    // Download SVG
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const svgElement = qrContainer.querySelector('svg');
      if (svgElement) {
        const svgText = svgElement.outerHTML;
        const blob = new Blob([svgText], {type: "image/svg+xml"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "qrcode.svg";
        a.click();
        URL.revokeObjectURL(url);
      }
    });

    // Download PNG
    document.getElementById('downloadPngBtn').addEventListener('click', () => {
      const svgElement = qrContainer.querySelector('svg');
      if (svgElement) {
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const canvas = document.createElement("canvas");
        canvas.width = 500;
        canvas.height = 500;
        const ctx = canvas.getContext("2d");

        const img = new Image();
        const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          ctx.drawImage(img, 0, 0, 500, 500);

          if (logoToggle.checked && logoOverlay.src) {
            const logoImg = new Image();
            logoImg.src = logoOverlay.src;
            logoImg.onload = function() {
              const size = parseInt(logoSize.value);
              ctx.drawImage(logoImg, (500 - size)/2, (500 - size)/2, size, size);
              const pngUrl = canvas.toDataURL("image/png");
              const a = document.createElement("a");
              a.href = pngUrl;
              a.download = "qrcode.png";
              a.click();
              URL.revokeObjectURL(url);
            };
          } else {
            const pngUrl = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = pngUrl;
            a.download = "qrcode.png";
            a.click();
            URL.revokeObjectURL(url);
          }
        };
        img.src = url;
      }
    });

    // Initial render
    generateQR();
  </script>
</body>
</html>
